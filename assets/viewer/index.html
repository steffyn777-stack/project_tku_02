<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1A1D2E; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.3, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(2, 3, 2);
scene.add(key);

const BONE_SUFFIX_MAP = {
  'shoulder-l': 'upperarm_l',
  'elbow-l':    'lowerarm_l',
  'wrist-l':    'hand_l',
  'shoulder-r': 'upperarm_r',
  'elbow-r':    'lowerarm_r',
  'wrist-r':    'hand_r',
};

const AXIS_CONFIG = {
  'shoulder-l': { axis: 'z', sign: -1 },
  'elbow-l':    { axis: 'z', sign: -1 },
  'wrist-l':    { axis: 'x', sign: -1 },
  'shoulder-r': { axis: 'z', sign: -1 },
  'elbow-r':    { axis: 'z', sign: -1 },
  'wrist-r':    { axis: 'x', sign: -1 },
};

const foundBones = {};
const restQuats = {};

const loader = new GLTFLoader();
const modelPath = window.flutterModelPath || 'turn_Left_hand.glb';
console.log('[3D-DEBUG] Starting to load model from:', modelPath);

// 用 XMLHttpRequest 讀 .glb(避開 fetch() 對 file:// 的限制)
const xhr = new XMLHttpRequest();
xhr.open('GET', modelPath, true);
xhr.responseType = 'arraybuffer';
xhr.onload = function() {
  if (xhr.status === 200 || xhr.status === 0) {
    console.log('[3D-DEBUG] XHR loaded, size:', xhr.response.byteLength);
    loader.parse(xhr.response, '', (gltf) => {
      console.log('[3D-DEBUG] Model parsed successfully!');
      const model = gltf.scene;
      scene.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const scale = 1.7 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);

      const box2 = new THREE.Box3().setFromObject(model);
      model.position.x -= (box2.min.x + box2.max.x) / 2;
      model.position.z -= (box2.min.z + box2.max.z) / 2;
      model.position.y -= box2.min.y;

      model.traverse((obj) => {
        if (!obj.isBone) return;
        for (const [key, suffix] of Object.entries(BONE_SUFFIX_MAP)) {
          if (obj.name.endsWith(suffix) && !foundBones[key]) {
            const lower = obj.name.toLowerCase();
            if (!lower.includes('twist') && !lower.includes('correctiveroot')) {
              foundBones[key] = obj;
              restQuats[key] = obj.quaternion.clone();
            }
          }
        }
      });

      console.log('[3D-DEBUG] Found bones:', Object.keys(foundBones));
      window.FlutterReady && window.FlutterReady.postMessage('ready');
    }, (error) => {
      console.error('[3D-DEBUG] Model parse FAILED:', error.message || error);
    });
  } else {
    console.error('[3D-DEBUG] XHR failed with status:', xhr.status);
  }
};
xhr.onerror = function() {
  console.error('[3D-DEBUG] XHR error loading', modelPath);
};
xhr.send();

function applyAngle(key, degrees) {
  const bone = foundBones[key];
  if (!bone) return;
  const cfg = AXIS_CONFIG[key];
  const rad = THREE.MathUtils.degToRad(degrees * cfg.sign);
  const axisVec = new THREE.Vector3(
    cfg.axis === 'x' ? 1 : 0,
    cfg.axis === 'y' ? 1 : 0,
    cfg.axis === 'z' ? 1 : 0,
  );
  const deltaQuat = new THREE.Quaternion().setFromAxisAngle(axisVec, rad);
  bone.quaternion.copy(restQuats[key]).multiply(deltaQuat);
}

// Flutter 呼叫這個函式傳入角度
window.updateBones = function(json) {
  const angles = JSON.parse(json);
  for (const [key, deg] of Object.entries(angles)) {
    applyAngle(key, deg);
  }
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
